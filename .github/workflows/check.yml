name: Check

# Проверка каждой ветки до слияния: тесты, сборка и автопроход сайта в браузере.
# Для main то же самое делает deploy.yml перед публикацией.
on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Браузер для автопрохода ставится только здесь, в зависимости сайта он не входит
      - run: npm install --no-save playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
