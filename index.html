<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Подготовка к олимпиадам по физике</title>
    <script>
      // Тема ставится до отрисовки, чтобы страница не мигала белым (остальное — в src/theme.js)
      ;(function () {
        var theme = null
        try {
          theme = localStorage.getItem('edu-theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
